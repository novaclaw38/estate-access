services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estate_security}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estate_security}
      POSTGRES_DB: ${POSTGRES_DB:-estate_security}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estate_security} -d ${POSTGRES_DB:-estate_security}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
